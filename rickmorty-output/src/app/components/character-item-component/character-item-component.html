<section class="card" style="max-width: 320px">
    <img [src]="character()?.image" class="card-img-top" [alt]="character()?.name">
    <div class="card-body">
        <h4 class="card-title">{{character()?.name}}</h4>
        <p class="card-text">{{character()?.species}} - {{character()?.status}}</p>
        <!-- STEP7: el clic lanza el output hacia el componente padre -->
        <button type="button" class="btn btn-primary" (click)="emitCharacterClicked()">View detail</button>
    </div>
</section>
